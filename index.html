<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Field Notes</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0e0e0e;
  --surface: #1a1a1a;
  --surface2: #242424;
  --border: #2e2e2e;
  --text: #e8e4dc;
  --text-dim: #7a7570;
  --accent: #c8b89a;
  --accent2: #8fb3a0;
  --font-display: Georgia, serif;
  --font-body: 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-body); }
#map { position: fixed; inset: 0; z-index: 1; }

#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  padding: 16px 20px 12px;
  background: linear-gradient(to bottom, rgba(14,14,14,0.96) 70%, transparent);
  display: flex; align-items: center; justify-content: space-between;
}
#title { font-family: var(--font-display); font-size: 15px; letter-spacing: 0.12em; color: var(--accent); text-transform: uppercase; }
#name-btn { font-size: 11px; color: var(--text-dim); cursor: pointer; padding: 5px 10px; border: 1px solid var(--border); border-radius: 2px; background: none; }

#bottom-controls {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  padding: 0 20px 36px;
  background: linear-gradient(to top, rgba(14,14,14,0.96) 70%, transparent);
}
#city-tabs { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
#city-tabs::-webkit-scrollbar { display: none; }
.city-tab { flex-shrink: 0; padding: 5px 12px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); border: 1px solid var(--border); border-radius: 2px; cursor: pointer; background: var(--surface); }
.city-tab.active { color: var(--accent); border-color: var(--accent); background: rgba(200,184,154,0.08); }
#action-row { display: flex; gap: 10px; }
#add-btn { flex: 1; padding: 14px; background: var(--accent); color: #0e0e0e; border: none; border-radius: 2px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
#feed-btn { padding: 14px 18px; background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border); border-radius: 2px; font-size: 16px; cursor: pointer; }

.panel { position: fixed; inset: 0; z-index: 200; background: var(--bg); transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16,1,0.3,1); overflow-y: auto; -webkit-overflow-scrolling: touch; }
.panel.open { transform: translateY(0); }
.panel-header { position: sticky; top: 0; background: var(--bg); padding: 20px 20px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; z-index: 10; }
.panel-title { font-family: var(--font-display); font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
.close-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--text-dim); cursor: pointer; font-size: 22px; }
.panel-body { padding: 20px; }

.field { margin-bottom: 20px; }
.field label { display: block; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; }
.field input, .field textarea { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 2px; color: var(--text); font-family: var(--font-body); font-size: 15px; padding: 12px; outline: none; -webkit-appearance: none; }
.field input:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { min-height: 90px; resize: none; line-height: 1.5; }

#photo-area { border: 1px dashed var(--border); border-radius: 2px; padding: 32px 20px; text-align: center; cursor: pointer; background: var(--surface); position: relative; overflow: hidden; }
#photo-area.has-photo { padding: 0; border-style: solid; border-color: var(--accent2); }
#photo-preview { width: 100%; max-height: 240px; object-fit: cover; display: none; }
#photo-label { font-size: 13px; color: var(--text-dim); line-height: 1.6; }
#photo-icon { font-size: 30px; margin-bottom: 10px; }
#photo-input { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 0; }

#location-status { margin-top: 10px; padding: 10px 12px; background: var(--surface2); border-radius: 2px; font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 8px; min-height: 38px; }

.submit-btn { width: 100%; padding: 14px; background: var(--accent); color: #0e0e0e; border: none; border-radius: 2px; font-family: var(--font-body); font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; margin-top: 8px; }
.submit-btn:disabled { opacity: 0.4; }

.feed-item { border-bottom: 1px solid var(--border); padding: 18px 20px; cursor: pointer; }
.feed-item-img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 2px; margin-bottom: 12px; cursor: pointer; }
#lightbox { position: fixed; inset: 0; z-index: 400; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; padding: 20px; }
#lightbox.hidden { display: none; }
#lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 2px; }
#lightbox-close { position: absolute; top: 20px; right: 20px; color: white; font-size: 32px; cursor: pointer; line-height: 1; }
.feed-meta { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
.feed-contributor { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.feed-time { font-size: 10px; color: var(--text-dim); }
.feed-location { font-size: 11px; color: var(--text-dim); margin-bottom: 6px; font-style: italic; }
.feed-note { font-size: 14px; line-height: 1.55; color: var(--text); }
.feed-empty { padding: 60px 20px; text-align: center; color: var(--text-dim); font-size: 13px; line-height: 1.7; }

#overlay { position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
#overlay.hidden { display: none; }
.overlay-card { background: var(--surface); border: 1px solid var(--border); border-radius: 3px; padding: 28px 24px; width: 100%; max-width: 340px; }
.overlay-card h2 { font-family: var(--font-display); font-size: 18px; color: var(--accent); margin-bottom: 8px; }
.overlay-card p { font-size: 13px; color: var(--text-dim); line-height: 1.5; margin-bottom: 20px; }
.overlay-card input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 2px; color: var(--text); font-size: 16px; padding: 12px; outline: none; margin-bottom: 14px; }
.overlay-card input:focus { border-color: var(--accent); }
.overlay-card button { width: 100%; padding: 13px; background: var(--accent); color: #0e0e0e; border: none; border-radius: 2px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }

#toast { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--surface2); border: 1px solid var(--border); border-radius: 2px; padding: 10px 18px; font-size: 12px; color: var(--text); opacity: 0; transition: all 0.25s; pointer-events: none; z-index: 500; white-space: nowrap; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.marker-dot { border-radius: 50%; border: 2px solid rgba(255,255,255,0.15); }
.dot-photo { width: 16px; height: 16px; background: #e8452a; box-shadow: 0 0 16px rgba(232,69,42,0.8); border: 2px solid rgba(255,255,255,0.6); }
.dot-note { width: 12px; height: 12px; background: #e8452a; box-shadow: 0 0 12px rgba(232,69,42,0.6); border: 2px solid rgba(255,255,255,0.4); opacity: 0.75; }

.leaflet-control-zoom { display: none !important; }
.leaflet-control-attribution { background: rgba(0,0,0,0.4) !important; color: #444 !important; font-size: 9px !important; }
.leaflet-tile { filter: brightness(0.4) saturate(0.25); }
</style>
</head>
<body>

<div id="map"></div>

<div id="topbar">
  <div id="title">Field Notes</div>
  <button id="name-btn">— set name</button>
</div>

<div id="bottom-controls">
  <div id="city-tabs">
    <div class="city-tab active" data-city="all">All</div>
    <div class="city-tab" data-city="St. Louis">St. Louis</div>
    <div class="city-tab" data-city="Berlin">Berlin</div>
    <div class="city-tab" data-city="Paris">Paris</div>
    <div class="city-tab" data-city="London">London</div>
    <div class="city-tab" data-city="Cologne">Cologne</div>
    <div class="city-tab" data-city="Venice">Venice</div>
  </div>
  <div id="action-row">
    <button id="add-btn">+ Add Observation</button>
    <button id="feed-btn">☰</button>
  </div>
</div>

<!-- ADD PANEL -->
<div id="add-panel" class="panel">
  <div class="panel-header">
    <span class="panel-title">New Observation</span>
    <div class="close-btn" id="close-add">×</div>
  </div>
  <div class="panel-body">
    <div class="field">
      <label>Photograph <span style="color:var(--text-dim);font-size:9px;letter-spacing:0">optional</span></label>
      <div id="photo-area">
        <div id="photo-label">
          <div id="photo-icon">⬡</div>
          Tap to add photo<br>
          <span style="font-size:11px;opacity:0.6">Location detected automatically</span>
        </div>
        <img id="photo-preview" alt=""/>
        <input type="file" id="photo-input" accept="image/*" capture="environment"/>
      </div>
      <div id="location-status">
        <span id="location-text">Location detected from photo or device GPS</span>
      </div>
    </div>

    <div class="field">
      <label>Label <span style="color:var(--text-dim);font-size:9px;letter-spacing:0">optional</span></label>
      <input type="text" id="label-input" placeholder="Name this place…"/>
    </div>

    <div class="field">
      <label>Note <span style="color:var(--text-dim);font-size:9px;letter-spacing:0">optional</span></label>
      <textarea id="note-input" placeholder="What stopped you here…"></textarea>
    </div>

    <button class="submit-btn" id="submit-btn">Add to Map</button>
    <div style="height:24px"></div>
  </div>
</div>

<!-- FEED PANEL -->
<div id="feed-panel" class="panel">
  <div class="panel-header">
    <span class="panel-title">All Observations</span>
    <div class="close-btn" id="close-feed">×</div>
  </div>
  <div id="feed-body"></div>
</div>

<!-- DETAIL PANEL -->
<div id="detail-panel" class="panel">
  <div class="panel-header">
    <span class="panel-title">Observation</span>
    <div class="close-btn" id="close-detail">×</div>
  </div>
  <div id="detail-body"></div>
</div>

<!-- NAME OVERLAY -->
<div id="overlay" class="hidden">
  <div class="overlay-card">
    <h2>Who are you?</h2>
    <p>Your name appears with every observation. You can change it anytime.</p>
    <input type="text" id="name-input" placeholder="Your name" maxlength="40" autocomplete="off"/>
    <button id="name-save-btn">Continue</button>
  </div>
</div>

<div id="toast"></div>
<div id="lightbox" class="hidden"><span id="lightbox-close">&times;</span><img id="lightbox-img" alt=""/></div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/exifr@7.1.3/dist/lite.umd.js"></script>

<script>
(function() {
  var SUPABASE_URL = 'https://mjirubqqgvemwxdixzsq.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_I3nGnJAof56DlaGBVbq16Q_u2bINm4R';

  var map, allPins = [];
  var currentCity = 'all';
  var contributor = localStorage.getItem('fn_name') || '';
  var photoFile = null;
  var detectedLat = null, detectedLng = null, detectedCity = null;

  var CITIES = {
    'all':      { center: [48.5, 10.0], zoom: 4 },
    'St. Louis':{ center: [38.627, -90.197], zoom: 13 },
    'Berlin':   { center: [52.520, 13.405], zoom: 13 },
    'Paris':    { center: [48.857, 2.352],  zoom: 13 },
    'London':   { center: [51.507, -0.128], zoom: 13 },
    'Cologne':  { center: [50.933, 6.950],  zoom: 13 },
    'Venice':   { center: [45.434, 12.338], zoom: 14 }
  };

  var CITY_BOUNDS = [
    { name: 'St. Louis', latMin: 38.50, latMax: 38.80, lngMin: -90.40, lngMax: -90.00 },
    { name: 'Venice',    latMin: 45.39, latMax: 45.50, lngMin: 12.20,  lngMax: 12.50  },
    { name: 'Berlin',    latMin: 52.33, latMax: 52.68, lngMin: 13.08,  lngMax: 13.77  },
    { name: 'Paris',     latMin: 48.74, latMax: 48.95, lngMin: 2.22,   lngMax: 2.47   },
    { name: 'London',    latMin: 51.38, latMax: 51.62, lngMin: -0.35,  lngMax: 0.15   },
    { name: 'Cologne',   latMin: 50.83, latMax: 51.08, lngMin: 6.77,   lngMax: 7.16   }
  ];

  function detectCity(lat, lng) {
    for (var i = 0; i < CITY_BOUNDS.length; i++) {
      var b = CITY_BOUNDS[i];
      if (lat >= b.latMin && lat <= b.latMax && lng >= b.lngMin && lng <= b.lngMax) return b.name;
    }
    return 'Unknown';
  }

  function api(path, method, body) {
    var opts = {
      method: method || 'GET',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      }
    };
    if (body) opts.body = JSON.stringify(body);
    return fetch(SUPABASE_URL + '/rest/v1/' + path, opts).then(function(r) { return r.json(); });
  }

  function uploadPhoto(file) {
    var ext = (file.name || 'photo.jpg').split('.').pop();
    var filename = Date.now() + '_' + Math.random().toString(36).slice(2) + '.' + ext;
    return fetch(SUPABASE_URL + '/storage/v1/object/photos/' + filename, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': file.type || 'image/jpeg'
      },
      body: file
    }).then(function(r) {
      if (!r.ok) throw new Error('Upload failed');
      return SUPABASE_URL + '/storage/v1/object/public/photos/' + filename;
    });
  }

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2500);
  }

  function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function fmtDate(iso) {
    try { return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); }
    catch(e) { return ''; }
  }

  function setLocStatus(color, text) {
    var el = document.getElementById('location-status');
    var colors = { green: 'var(--accent2)', red: '#c0735a', dim: 'var(--text-dim)' };
    el.style.color = colors[color] || colors.dim;
    document.getElementById('location-text').textContent = text;
  }

  // GPS from EXIF
  function extractGPS(file) {
    return new Promise(function(resolve) {
      if (typeof exifr === 'undefined') { resolve(null); return; }
      exifr.gps(file).then(function(gps) {
        resolve(gps && gps.latitude ? { lat: gps.latitude, lng: gps.longitude } : null);
      }).catch(function() { resolve(null); });
    });
  }

  // GPS from device
  function getDeviceGPS() {
    return new Promise(function(resolve) {
      if (!navigator.geolocation) { resolve(null); return; }
      navigator.geolocation.getCurrentPosition(
        function(p) { resolve({ lat: p.coords.latitude, lng: p.coords.longitude }); },
        function() { resolve(null); },
        { timeout: 8000, maximumAge: 60000 }
      );
    });
  }

  function setCoords(lat, lng, source) {
    detectedLat = lat;
    detectedLng = lng;
    detectedCity = detectCity(lat, lng);
    setLocStatus('green', '📍 ' + detectedCity + (source ? ' — ' + source : ''));
    map.setView([lat, lng], 15, { animate: true });
  }

  // PHOTO
  function initPhoto() {
    var input = document.getElementById('photo-input');
    input.addEventListener('change', function() {
      var file = input.files[0];
      if (!file) return;
      photoFile = file;

      var reader = new FileReader();
      reader.onload = function(e) {
        var img = document.getElementById('photo-preview');
        img.src = e.target.result;
        img.style.display = 'block';
        document.getElementById('photo-label').style.display = 'none';
        document.getElementById('photo-area').classList.add('has-photo');
      };
      reader.readAsDataURL(file);

      setLocStatus('dim', 'Reading location…');
      extractGPS(file).then(function(gps) {
        if (gps) {
          setCoords(gps.lat, gps.lng, 'photo GPS');
        } else {
          setLocStatus('dim', 'No GPS in photo — checking device…');
          getDeviceGPS().then(function(loc) {
            if (loc) {
              setCoords(loc.lat, loc.lng, 'device GPS');
            } else {
              // Fall back to map center
              var c = map.getCenter();
              setCoords(c.lat, c.lng, 'map center');
              setLocStatus('red', 'GPS unavailable — using map center. Move map to correct location.');
            }
          });
        }
      });
    });

    document.getElementById('photo-area').addEventListener('click', function(e) {
      if (e.target !== input) input.click();
    });
  }

  // MAP
  function initMap() {
    map = L.map('map', { center: CITIES['St. Louis'].center, zoom: CITIES['St. Louis'].zoom, zoomControl: false });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap', maxZoom: 19
    }).addTo(map);
  }

  function makeIcon(cls) {
    return L.divIcon({ className: '', html: '<div class="marker-dot ' + cls + '"></div>', iconSize: [14,14], iconAnchor: [7,7] });
  }

  var markerList = [];
  function renderMarkers() {
    markerList.forEach(function(m) { map.removeLayer(m); });
    markerList = [];
    var pins = currentCity === 'all' ? allPins : allPins.filter(function(p) { return p.city === currentCity; });
    pins.forEach(function(pin) {
      if (!pin.lat || !pin.lng) return;
      var cls = pin.photo_url ? 'dot-photo' : 'dot-note';
      var m = L.marker([pin.lat, pin.lng], { icon: makeIcon(cls) }).addTo(map);
      m.on('click', (function(p) { return function() { openDetail(p); }; })(pin));
      markerList.push(m);
    });
  }

  function loadData() {
    api('pins?select=*&order=created_at.desc').then(function(pins) {
      allPins = Array.isArray(pins) ? pins : [];
      renderMarkers();
    }).catch(function() { showToast('Could not load data'); });
  }

  // CITY TABS
  function initTabs() {
    document.querySelectorAll('.city-tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.city-tab').forEach(function(t) { t.classList.remove('active'); });
        tab.classList.add('active');
        currentCity = tab.dataset.city;
        renderMarkers();
        var c = CITIES[currentCity] || CITIES.all;
        map.setView(c.center, c.zoom, { animate: true });
      });
    });
  }

  // PANELS
  function openPanel(id) { document.getElementById(id).classList.add('open'); }
  function closePanel(id) { document.getElementById(id).classList.remove('open'); }

  function openDetail(pin) {
    var isOwner = pin.contributor_name === contributor;
    var body = document.getElementById('detail-body');
    function renderView() {
      body.innerHTML =
        '<div class="feed-item" id="detail-view">' +
        (pin.photo_url ? '<img class="feed-item-img" src="' + esc(pin.photo_url) + '" loading="lazy" alt=""/>' : '') +
        '<div class="feed-meta"><span class="feed-contributor">' + esc(pin.contributor_name) + '</span><span class="feed-time">' + fmtDate(pin.created_at) + '</span></div>' +
        '<div class="feed-location">' + (pin.label ? esc(pin.label) + ' · ' : '') + esc(pin.city) + '</div>' +
        (pin.note ? '<div class="feed-note">' + esc(pin.note) + '</div>' : '<div class="feed-note" style="color:var(--text-dim);font-style:italic">No note</div>') +
        (isOwner ?
          '<div style="display:flex;gap:8px;margin-top:16px">' +
          '<button id="edit-note-btn" style="flex:1;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:2px;color:var(--accent);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer">Edit Note</button>' +
          '<button id="delete-pin-btn" style="padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:2px;color:#c0735a;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer">Delete</button>' +
          '</div>' : '') +
        '</div>';

      if (isOwner) {
        document.getElementById('edit-note-btn').addEventListener('click', function() {
          var current = pin.note || '';
          body.innerHTML =
            '<div style="padding:20px">' +
            '<textarea id="edit-note-area" style="width:100%;min-height:120px;background:var(--surface);border:1px solid var(--accent);border-radius:2px;color:var(--text);font-family:var(--font-body);font-size:15px;padding:12px;outline:none;resize:none;line-height:1.5;margin-bottom:12px">' + esc(current) + '</textarea>' +
            '<div style="display:flex;gap:8px">' +
            '<button id="save-note-btn" style="flex:1;padding:12px;background:var(--accent);border:none;border-radius:2px;color:#0e0e0e;font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer">Save</button>' +
            '<button id="cancel-edit-btn" style="padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:2px;color:var(--text-dim);font-size:12px;cursor:pointer">Cancel</button>' +
            '</div></div>';
          document.getElementById('save-note-btn').addEventListener('click', function() {
            var newNote = document.getElementById('edit-note-area').value.trim();
            api('pins?id=eq.' + pin.id, 'PATCH', { note: newNote || null }).then(function() {
              pin.note = newNote;
              var idx = allPins.findIndex(function(p) { return p.id === pin.id; });
              if (idx > -1) allPins[idx].note = newNote;
              showToast('Note updated');
              renderView();
            }).catch(function() { showToast('Error saving'); });
          });
          document.getElementById('cancel-edit-btn').addEventListener('click', renderView);
        });

        document.getElementById('delete-pin-btn').addEventListener('click', function() {
          body.innerHTML =
            '<div style="padding:40px 20px;text-align:center">' +
            '<div style="font-size:14px;color:var(--text);margin-bottom:20px;line-height:1.5">Delete this observation?<br><span style="color:var(--text-dim);font-size:12px">This cannot be undone.</span></div>' +
            '<div style="display:flex;gap:8px">' +
            '<button id="confirm-delete-btn" style="flex:1;padding:12px;background:#c0735a;border:none;border-radius:2px;color:white;font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer">Delete</button>' +
            '<button id="cancel-delete-btn" style="flex:1;padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:2px;color:var(--text-dim);font-size:12px;cursor:pointer">Cancel</button>' +
            '</div></div>';
          document.getElementById('confirm-delete-btn').addEventListener('click', function() {
            api('pins?id=eq.' + pin.id, 'DELETE').then(function() {
              allPins = allPins.filter(function(p) { return p.id !== pin.id; });
              renderMarkers();
              closePanel('detail-panel');
              showToast('Deleted');
            }).catch(function() { showToast('Error deleting'); });
          });
          document.getElementById('cancel-delete-btn').addEventListener('click', renderView);
        });
      }
    }
    renderView();
    openPanel('detail-panel');
  }

  function renderFeed() {
    var body = document.getElementById('feed-body');
    var pins = currentCity === 'all' ? allPins : allPins.filter(function(p) { return p.city === currentCity; });
    if (!pins.length) {
      body.innerHTML = '<div class="feed-empty">No observations yet.<br>Be the first.</div>';
      return;
    }
    body.innerHTML = pins.map(function(p) {
      return '<div class="feed-item" data-lat="' + p.lat + '" data-lng="' + p.lng + '">' +
        (p.photo_url ? '<img class="feed-item-img" src="' + esc(p.photo_url) + '" loading="lazy" alt=""/>' : '') +
        '<div class="feed-meta"><span class="feed-contributor">' + esc(p.contributor_name) + '</span><span class="feed-time">' + fmtDate(p.created_at) + '</span></div>' +
        '<div class="feed-location">' + (p.label ? esc(p.label) + ' · ' : '') + esc(p.city) + '</div>' +
        (p.note ? '<div class="feed-note">' + esc(p.note) + '</div>' : '') +
        '</div>';
    }).join('');
    body.querySelectorAll('.feed-item').forEach(function(el) {
      el.addEventListener('click', function() {
        var lat = parseFloat(el.dataset.lat), lng = parseFloat(el.dataset.lng);
        if (lat && lng) { closePanel('feed-panel'); map.setView([lat, lng], 16, { animate: true }); }
      });
    });
  }

  function resetForm() {
    photoFile = null; detectedLat = null; detectedLng = null; detectedCity = null;
    document.getElementById('note-input').value = '';
    document.getElementById('label-input').value = '';
    document.getElementById('photo-preview').style.display = 'none';
    document.getElementById('photo-label').style.display = 'block';
    document.getElementById('photo-area').classList.remove('has-photo');
    document.getElementById('photo-input').value = '';
    setLocStatus('dim', 'Location detected from photo or device GPS');
  }

  // SUBMIT
  function submitPin() {
    if (!contributor) { showNameOverlay(); return; }

    // If no GPS detected yet, use map center
    if (!detectedLat || !detectedLng) {
      var c = map.getCenter();
      detectedLat = c.lat;
      detectedLng = c.lng;
      detectedCity = detectCity(c.lat, c.lng);
    }

    var savedLat = detectedLat, savedLng = detectedLng, savedCity = detectedCity;
    var note = document.getElementById('note-input').value.trim();
    var label = document.getElementById('label-input').value.trim();
    var btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = photoFile ? 'Uploading…' : 'Saving…';

    var doUpload = photoFile ? uploadPhoto(photoFile) : Promise.resolve(null);
    doUpload.then(function(photoUrl) {
      return api('pins', 'POST', {
        contributor_name: contributor,
        note: note || null,
        label: label || null,
        photo_url: photoUrl,
        city: savedCity,
        lat: savedLat,
        lng: savedLng
      });
    }).then(function(res) {
      btn.disabled = false; btn.textContent = 'Add to Map';
      if (Array.isArray(res) && res[0]) {
        allPins.unshift(res[0]);
        renderMarkers();
        closePanel('add-panel');
        resetForm();
        showToast('Added');
        map.setView([savedLat, savedLng], 15, { animate: true });
      } else {
        console.error('Pin save error:', res);
        showToast('Error saving — check console');
      }
    }).catch(function(e) {
      btn.disabled = false; btn.textContent = 'Add to Map';
      console.error('Submit error:', e);
      showToast('Error — try again');
    });
  }

  // NAME
  function showNameOverlay() {
    document.getElementById('name-input').value = contributor;
    document.getElementById('overlay').classList.remove('hidden');
    setTimeout(function() { document.getElementById('name-input').focus(); }, 100);
  }

  function saveName() {
    var val = document.getElementById('name-input').value.trim();
    if (!val) return;
    contributor = val;
    localStorage.setItem('fn_name', val);
    document.getElementById('name-btn').textContent = val;
    document.getElementById('overlay').classList.add('hidden');
  }

  // BOOT
  window.addEventListener('load', function() {
    initMap();
    initTabs();
    initPhoto();
    loadData();

    if (contributor) {
      document.getElementById('name-btn').textContent = contributor;
    } else {
      showNameOverlay();
    }

    document.getElementById('name-btn').addEventListener('click', showNameOverlay);
    document.getElementById('name-save-btn').addEventListener('click', saveName);
    document.getElementById('name-input').addEventListener('keydown', function(e) { if (e.key === 'Enter') saveName(); });
    document.getElementById('add-btn').addEventListener('click', function() {
      if (!contributor) { showNameOverlay(); return; }
      openPanel('add-panel');
    });
    document.getElementById('feed-btn').addEventListener('click', function() { renderFeed(); openPanel('feed-panel'); });
    document.getElementById('close-add').addEventListener('click', function() { closePanel('add-panel'); resetForm(); });
    document.getElementById('close-feed').addEventListener('click', function() { closePanel('feed-panel'); });
    document.getElementById('close-detail').addEventListener('click', function() { closePanel('detail-panel'); });
    document.getElementById('submit-btn').addEventListener('click', submitPin);
  });

  window.showNameOverlay = showNameOverlay;

  // LIGHTBOX
  function openLightbox(src) {
    document.getElementById("lightbox-img").src = src;
    document.getElementById("lightbox").classList.remove("hidden");
  }
  document.addEventListener("click", function(e) {
    if (e.target.classList.contains("feed-item-img")) {
      openLightbox(e.target.src);
    }
    if (e.target.id === "lightbox" || e.target.id === "lightbox-close") {
      document.getElementById("lightbox").classList.add("hidden");
      document.getElementById("lightbox-img").src = "";
    }
  });
})();
</script>
</body>
</html>
